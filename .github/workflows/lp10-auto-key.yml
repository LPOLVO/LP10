name: Auto-protect LP10 scripts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LP10 source scripts
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout LP10-UNIVERSAL protected repository
        uses: actions/checkout@v4
        with:
          repository: LPOLVO/LP10-UNIVERSAL-
          ref: main
          token: ${{ secrets.UNIVERSAL_REPO_TOKEN }}
          path: protected

      - name: Generate protected copies
        env:
          SOURCE_REPO: LPOLVO/LP10
          SOURCE_BRANCH: main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import os
          import re

          source_dir = Path("source")
          protected_dir = Path("protected")
          template_path = protected_dir / "KeySystemTemplate"

          if not template_path.exists():
              raise SystemExit(
                  "Missing protected/KeySystemTemplate. "
                  "Upload the current Key System there once."
              )

          template = template_path.read_text(encoding="utf-8")
          source_repo = os.environ["SOURCE_REPO"]
          source_branch = os.environ["SOURCE_BRANCH"]

          ignored_names = {
              ".git", ".github", "README.md", "LICENSE",
              "KeySystemTemplate", "version.txt"
          }
          ignored_suffixes = {
              ".md", ".txt", ".json", ".yml", ".yaml",
              ".png", ".jpg", ".jpeg", ".gif"
          }

          main_url_pattern = re.compile(
              r'(?m)^(\s*MainScriptURL\s*=\s*)"[^"]*"'
          )

          generated = 0
          for item in sorted(source_dir.iterdir()):
              if not item.is_file():
                  continue
              if item.name in ignored_names or item.name.startswith("."):
                  continue
              if item.suffix.lower() in ignored_suffixes:
                  continue

              relative = item.relative_to(source_dir).as_posix()
              raw_url = (
                  f"https://raw.githubusercontent.com/{source_repo}/"
                  f"{source_branch}/{quote(relative, safe='/')}"
              )

              protected_text, replacements = main_url_pattern.subn(
                  lambda m: f'{m.group(1)}"{raw_url}"',
                  template,
                  count=1
              )
              if replacements != 1:
                  raise SystemExit(
                      "KeySystemTemplate must contain one MainScriptURL line."
                  )

              output = protected_dir / relative
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(protected_text, encoding="utf-8")
              print(f"Protected: {relative} -> {raw_url}")
              generated += 1

          print(f"Generated {generated} protected script(s).")
          PY

      - name: Commit protected copies
        working-directory: protected
        run: |
          git config user.name "LP10 Auto Key Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No protected-script changes to commit."
            exit 0
          fi
          git commit -m "Auto-protect LP10 scripts"
          git push origin main